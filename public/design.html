<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Design dit eget smykke i personlige farver og størrelser. Lav unikke armbånd, halskæder og øreringe i din egen stil." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Design dit eget smykke | HosEjbye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <nav class="topbar card">
      <a class="brand-mark brand-link" href="index.html">HosEjbye Studio</a>
      <div class="topbar-links">
        <a class="admin-link" href="index.html">Start</a>
        <a class="admin-link" href="lager.html">Smykker</a>
        <a class="admin-link" href="keramik.html">Keramik</a>
      </div>
    </nav>

    <header class="hero">
      <p class="eyebrow">Bestil personlige smykker</p>
      <h1>Design dit eget</h1>
      <p class="intro">Vælg smykketype, længde og perler. Du behøver ikke vælge en arbejder.</p>
      <p class="intro"><a class="admin-link" href="index.html">← Tilbage</a></p>
    </header>

    <section class="panel">
      <div class="design-builder">
        <section class="card controls">
          <h2>1. Grundvalg</h2>

          <label for="productType">Smykketype</label>
          <select id="productType">
            <option value="bracelet">Armbånd</option>
            <option value="necklace">Halskæde</option>
            <option value="earrings">Øreringe</option>
            <option value="keyring">Nøglering</option>
          </select>

          <label for="targetLength">Ønsket længde (cm)</label>
          <input id="targetLength" type="number" min="5" max="100" step="0.5" value="18" />

          <label for="beadSize">Perlestørrelse til næste perle</label>
          <select id="beadSize">
            <option value="8">8 mm</option>
            <option value="9">9 mm</option>
            <option value="10" selected>10 mm</option>
            <option value="11">11 mm</option>
            <option value="12">12 mm</option>
          </select>

          <div class="stats" id="statsBox"></div>
        </section>

        <section class="card designer">
          <h2>2. Design med perler</h2>
          <p class="help">Vælg størrelse, klik derefter en farve. Du kan skifte størrelse undervejs og mixe perler.</p>

          <div class="palette" id="palette"></div>

          <div class="actions">
            <button id="undoBtn" type="button" class="secondary">Fjern sidste</button>
            <button id="clearBtn" type="button" class="secondary">Ryd alle</button>
          </div>

          <div class="preview-wrap">
            <div id="preview" class="preview" aria-label="Valgte perler"></div>
          </div>
        </section>

        <section class="card summary">
          <div id="orderSummary"></div>
          <button id="orderBtn" type="button" class="primary">Læg i kurv</button>
          <p id="orderMessage" class="order-message"></p>
        </section>
      </div>

    </section>
  </main>

  <script src="flyout.js"></script>
  <script src="global-cart.js"></script>
  <script src="cart-overview.js"></script>
  <script src="app.js"></script>
</body>
</html>
