<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejer login - HosEjbye</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Butiksejer</p>
      <h1>Admin login</h1>
      <p class="intro">Log ind for at se og opdatere ordrer.</p>
      <p class="intro"><a class="admin-link" href="index.html">Tilbage til HosEjbye</a></p>
    </header>

    <section class="panel card" id="loginPanel">
      <h2>Login</h2>
      <label for="username">Brugernavn</label>
      <input id="username" type="text" placeholder="owner" />
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="********" />
      <div class="actions">
        <button id="loginBtn" class="primary" type="button">Log ind</button>
      </div>
      <p id="loginMessage" class="order-message"></p>
    </section>

    <section class="panel card hidden" id="adminPanel">
      <div class="actions">
        <button id="refreshBtn" type="button" class="secondary">Opdater liste</button>
        <button id="activeTabBtn" type="button" class="admin-switch-link active">Aktive ordrer</button>
        <button id="finishedTabBtn" type="button" class="admin-switch-link">Færdige ordrer</button>
        <button id="logoutBtn" type="button" class="secondary">Log ud</button>
      </div>

      <h2>Økonomisk overblik</h2>
      <div id="statsBox" class="stats-grid"></div>

      <section>
        <h2>Rediger forside</h2>
        <div class="checkout-form">
          <label for="siteHeroTitleInput">Hovedtitel</label>
          <input id="siteHeroTitleInput" type="text" placeholder="HosEjbye" />

          <label for="siteHeroIntro1Input">Intro linje 1</label>
          <textarea id="siteHeroIntro1Input" rows="2"></textarea>

          <label for="siteHeroIntro2Input">Intro linje 2</label>
          <textarea id="siteHeroIntro2Input" rows="2"></textarea>

          <label for="siteAboutText1Input">Om virksomheden linje 1</label>
          <textarea id="siteAboutText1Input" rows="2"></textarea>

          <label for="siteAboutText2Input">Om virksomheden linje 2</label>
          <textarea id="siteAboutText2Input" rows="2"></textarea>

          <div class="checkout-inline">
            <div>
              <label for="siteContactEmailInput">Email</label>
              <input id="siteContactEmailInput" type="text" />
            </div>
            <div>
              <label for="siteContactPhoneInput">Telefon</label>
              <input id="siteContactPhoneInput" type="text" />
            </div>
          </div>

          <div class="checkout-inline">
            <div>
              <label for="siteBoothAddressInput">Adresse/Bod</label>
              <input id="siteBoothAddressInput" type="text" />
            </div>
            <div>
              <label for="siteOpeningHoursInput">Åbningstid</label>
              <input id="siteOpeningHoursInput" type="text" />
            </div>
          </div>

          <div class="actions">
            <button id="reloadSiteContentBtn" type="button" class="secondary">Hent indhold</button>
            <button id="saveSiteContentBtn" type="button" class="primary">Gem forside</button>
          </div>
          <p id="siteContentMessage" class="order-message"></p>
        </div>
      </section>

      <section id="activeOrdersSection">
        <h2>Ordrer</h2>
        <div id="ordersList"></div>
      </section>

      <section id="finishedOrdersSection" class="hidden">
        <h2>Arkiverede ordrer</h2>
        <p class="intro">Her ligger ordrer der er flyttet væk. Du kan gendanne dem til aktiv liste.</p>
        <div id="archivedOrdersList"></div>
      </section>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
